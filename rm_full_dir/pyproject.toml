[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microstructure-mri"
version = "0.1.0.dev0"
description = "Composable diffusion MRI biophysical signal simulation and fitting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
fitting = [
    "emcee>=3.1",
]
diagnostics = [
    "arviz>=0.18",
    "corner>=2.2",
    "matplotlib>=3.8",
]
io = [
    "nibabel>=5.2",
    "fslpy>=3.14",
]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]
test = [
    "pytest>=8",
]
dev = [
    "emcee>=3.1",
    "arviz>=0.18",
    "corner>=2.2",
    "matplotlib>=3.8",
    "nibabel>=5.2",
    "fslpy>=3.14",
    "jupyterlab>=4",
    "tqdm>=4.66",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dmri_models"]
artifacts = ["src/dmri_models/data/**"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
